# Nginx configuration for LibraGuard Flutter Web
# Location on server: /etc/nginx/sites-available/libraguard

server {
    listen 8080;
    server_name libraguard.mkdezzu.site localhost;

    # Directory where the compiled flutter web files (contents of build/web) are stored
    root /var/www/libraguard;
    index index.html;

    # Enable gzip compression for faster Flutter Web loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Handle Flutter Single-Page App (SPA) routing
    # This prevents 404 errors when users refresh on deep links (e.g., /login, /home)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, wasm, js, css)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
